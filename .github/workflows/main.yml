---
name: MainFlow

on:
  workflow_dispatch:
    inputs:
      env:
        description: Select env
        required: true
        type: choice
        options:
          - meta
        default: meta

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_S3 }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_S3 }}
  AWS_BUCKET_ZONE: eu-central-1

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NODE_VERSION: 8.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: s3_site
          path: build

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: ${{ github.event.inputs.env }}
      url: https://${{ vars.AWS_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s3_site
          path: build
      - uses: reggionick/s3-deploy@v4
        with:
          folder: build
          bucket-region: ${{ env.AWS_BUCKET_ZONE }}
          bucket: ${{ vars.AWS_BUCKET }}
          dist-id: ${{ vars.AWS_CF_DISTRIBUTION_ID }}
          invalidation: /
          delete-removed: true
          private: true
          cache: 120

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.AWS_CF_DISTRIBUTION_ID }} --paths "/*"
